<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Finanças</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg0:#0a0e1a;--bg1:#111827;--bg2:#1a2235;--bg3:#223150;--acc:#3b82f6;--acc2:#60a5fa;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--t1:#f0f4ff;--t2:#94a3b8;--t3:#64748b;--bd:rgba(59,130,246,.22)}
html,body{background:var(--bg0);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:20;background:var(--bg1);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:16px}
.month{display:flex;align-items:center;gap:6px}
.month button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--t1);font-size:20px}
.month span{min-width:118px;text-align:center;font-size:13px;text-transform:capitalize}
main{padding:12px 14px}
.card{background:var(--bg1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:10px}
.hero{text-align:center;background:linear-gradient(160deg,#16264a,var(--bg1))}
.lbl{font-size:12px;color:var(--t2)}
.big{font-size:32px;font-weight:700;margin:4px 0}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}
.sub{font-size:12px;color:var(--t2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0;padding:12px}
.grid .v{font-size:17px;font-weight:600;margin-top:3px}
.bar{margin-bottom:14px}
.brow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.track{position:relative;height:10px;background:var(--bg3);border-radius:6px;overflow:visible}
.fill{height:100%;border-radius:6px}
.fill.ok{background:var(--green)}.fill.warn{background:var(--amber)}.fill.bad{background:var(--red)}
.mark{position:absolute;top:-3px;width:2px;height:16px;background:#fff;opacity:.8}
.bmeta{font-size:11px;color:var(--t3);margin-top:4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.chk{background:none;border:none;font-size:22px;width:34px}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-size:14px;font-weight:500}
.rmain small{font-size:11px;color:var(--t3)}
.rval{font-size:14px;font-weight:600;white-space:nowrap}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--acc);color:#fff;font-size:15px;font-weight:600;margin-top:10px}
.btn.sec{background:var(--bg3);color:var(--t1)}
.btn.del{background:#3b1418;color:#fca5a5}
label{display:block;font-size:12px;color:var(--t2);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--t1);font-size:16px}
.chkl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t1)}
.chkl input{width:20px;height:20px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 2px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--t2);font-size:12px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg1);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 2px;background:none;border:none;color:var(--t3);font-size:10px}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--acc2)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--bg1);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 28px}
.note{font-size:12px;color:var(--t2);line-height:1.5;margin-top:8px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--bg3);color:var(--t2);margin-right:4px}
input[type=range]{padding:0}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>💰 Finanças</h1>
  <div class="month"><button onclick="mv(-1)">‹</button><span id="mlabel"></span><button onclick="mv(1)">›</button></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-t="painel" onclick="go('painel')"><span>📊</span>Painel</button>
  <button data-t="contas" onclick="go('contas')"><span>🧾</span>Contas</button>
  <button data-t="lancar" onclick="go('lancar')"><span>➕</span>Lançar</button>
  <button data-t="reserva" onclick="go('reserva')"><span>🏦</span>Reserva</button>
  <button data-t="config" onclick="go('config')"><span>⚙️</span>Ajustes</button>
</nav>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<script>
//<LOGIC>
var KEY='fin_novo_v1';
var S;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function mkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function addM(k,n){var p=k.split('-').map(Number);return mkey(new Date(p[0],p[1]-1+n,1))}
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function mlabel(k){var p=k.split('-');return MESES[+p[1]-1]+' '+p[0]}
function brl(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function pct(v){return (isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}
function num(s){s=String(s==null?'':s).trim().replace(/[^\d,.\-]/g,'');if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isNaN(n)?0:n}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function seed(){
  function it(id,nome,valor,tipo,dia,o){return Object.assign({id:id,nome:nome,valor:valor,tipo:tipo,dia:dia||'',flex:false,desde:'',ate:'',obs:''},o||{})}
  var itens=[
    it('apto','Apartamento',2300,'N',10),
    it('cond','Condomínio',903.17,'N'),
    it('iptu','IPTU',65.87,'N'),
    it('luz','Luz (média)',650,'N','',{flex:true}),
    it('gas','Gás',51,'N'),
    it('net','Internet',99.9,'N'),
    it('vivo1','Vivo Darwin',88.24,'N'),
    it('vivo2','Vivo Amanda',88.24,'N'),
    it('plano','Plano de saúde',1591.76,'N'),
    it('dent','Dentista',190,'N'),
    it('escola','Escola',1566.67,'N'),
    it('ingles','Inglês',235,'D'),
    it('jiu','Jiu-jitsu',250,'D'),
    it('carro','Carro (parcela)',1216.33,'N'),
    it('ipva','IPVA (última parcela em dez/26)',656.44,'N','',{ate:'2026-12'}),
    it('transp','Transporte',400,'N'),
    it('comb','Combustível',670,'N','',{flex:true,qtd:2.5,unit:268}),
    it('mercado','Supermercado',1800,'N','',{flex:true}),
    it('cartao','Cartão (seguro do carro + casa)',1450,'N',15,{flex:true}),
    it('das','DAS',82.05,'N')
  ];
  var pagos={};
  ['escola','transp','dent','jiu','ingles','cond','iptu','gas','net','vivo1','vivo2','carro','ipva','das','plano'].forEach(function(k){pagos[k]=true});
  return {
    v:1,
    cfg:{salario:15079.75,extra:6178.5,extraAtivo:true,extraAte:'',aportePlan:4872.04,investido:59696.96,saldo:'',mesesReserva:6,meta:{nec:65,des:10,poup:25}},
    itens:itens,
    lanc:[
      {id:uid(),data:'2026-11-08',tipo:'saida',cls:'N',desc:'Ginecologista',valor:400},
      {id:uid(),data:'2026-11-08',tipo:'saida',cls:'N',desc:'Ultrassom',valor:230}
    ],
    pagos:{'2026-11':pagos}
  };
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
  if(!S||!S.cfg||!S.itens){S=seed();save()}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function ativo(i,m){return (!i.desde||m>=i.desde)&&(!i.ate||m<=i.ate)}
function valorIt(i){return (i.qtd!=null&&i.qtd!=='')?(+i.qtd||0)*(+i.unit||0):(+i.valor||0)}
function extraOn(m){return !!S.cfg.extraAtivo&&(!S.cfg.extraAte||m<=S.cfg.extraAte)}
function isPago(m,id){return !!(S.pagos[m]&&S.pagos[m][id])}
function calc(m,sem){
  var r={total:0,N:0,D:0,flex:0,pago:0,pN:0,pD:0,ent:0,apo:0,res:0};
  S.itens.forEach(function(i){
    if(!ativo(i,m))return;
    var v=valorIt(i);r.total+=v;
    if(i.tipo==='D')r.D+=v;else r.N+=v;
    if(i.flex)r.flex+=v;
    if(isPago(m,i.id))r.pago+=v;
  });
  S.lanc.forEach(function(l){
    if(String(l.data).slice(0,7)!==m)return;
    var v=+l.valor||0;
    if(l.tipo==='saida'){if(l.cls==='D')r.pD+=v;else r.pN+=v}
    else if(l.tipo==='entrada')r.ent+=v;
    else if(l.tipo==='aporte')r.apo+=v;
    else if(l.tipo==='resgate')r.res+=v;
  });
  r.extra=(!sem&&extraOn(m))?(+S.cfg.extra||0):0;
  r.renda=(+S.cfg.salario||0)+r.extra+r.ent;
  r.nec=r.N+r.pN;r.des=r.D+r.pD;r.gastos=r.nec+r.des;
  r.sobra=r.renda-r.gastos;
  r.aPagar=r.total-r.pago;
  r.pNec=r.renda?r.nec/r.renda*100:0;
  r.pDes=r.renda?r.des/r.renda*100:0;
  r.pPoup=r.renda?r.sobra/r.renda*100:0;
  return r;
}
//</LOGIC>

var view={m:mkey(new Date()),tab:'painel',tipo:'saida'};

function bar(lbl,v,meta,mode,money){
  var st=mode==='max'?(v<=meta?'ok':(v<=meta+5?'warn':'bad')):(v>=meta?'ok':(v>=meta-5?'warn':'bad'));
  var w=Math.max(0,Math.min(100,v)),mk=Math.min(100,meta);
  return '<div class="bar"><div class="brow"><span>'+lbl+'</span><span>'+pct(v)+' · '+brl(money)+'</span></div>'+
    '<div class="track"><div class="fill '+st+'" style="width:'+w+'%"></div><div class="mark" style="left:'+mk+'%"></div></div>'+
    '<div class="bmeta">'+(mode==='max'?'limite ':'mínimo ')+meta+'% da renda</div></div>';
}

function rPainel(){
  var m=view.m,c=calc(m),cs=calc(m,true),M=S.cfg.meta,h='';
  h+='<div class="card hero"><div class="lbl">Sobra do mês</div><div class="big '+(c.sobra>=0?'g':'r')+'">'+brl(c.sobra)+'</div>'+
     '<div class="sub">Renda '+brl(c.renda)+' − gastos '+brl(c.gastos)+'</div></div>';
  h+='<div class="card"><h3>Distribuição da renda</h3>'+
     bar('Necessidades',c.pNec,M.nec,'max',c.nec)+
     bar('Desejos',c.pDes,M.des,'max',c.des)+
     bar('Poupança (sobra)',c.pPoup,M.poup,'min',c.sobra)+'</div>';
  h+='<div class="grid">'+
     '<div class="card"><div class="lbl">Contas previstas</div><div class="v">'+brl(c.total)+'</div></div>'+
     '<div class="card"><div class="lbl">Pontuais do mês</div><div class="v">'+brl(c.pN+c.pD)+'</div></div>'+
     '<div class="card"><div class="lbl">Já pago</div><div class="v g">'+brl(c.pago)+'</div></div>'+
     '<div class="card"><div class="lbl">A pagar</div><div class="v a">'+brl(c.aPagar)+'</div></div></div>';
  if(extraOn(m)){
    h+='<div class="card"><h3>E se o extra acabar?</h3>'+
       '<div class="brow"><span>Sobra sem o extra</span><b class="'+(cs.sobra>=0?'g':'r')+'">'+brl(cs.sobra)+'</b></div>'+
       '<div class="brow"><span>Poupança sem o extra</span><b>'+pct(cs.pPoup)+'</b></div>'+
       '<div class="brow"><span>Necessidades sem o extra</span><b>'+pct(cs.pNec)+'</b></div>'+
       '<div class="note">O extra de '+brl(S.cfg.extra)+' está contado na renda. Este quadro mostra o orçamento só com o salário.</div></div>';
  }
  var livre=c.sobra-c.apo+c.res;
  h+='<div class="card"><h3>Aportes do mês</h3>'+
     '<div class="brow"><span>Aportado</span><b>'+brl(c.apo)+'</b></div>'+
     '<div class="brow"><span>Plano mensal</span><b>'+brl(S.cfg.aportePlan)+'</b></div>'+
     '<div class="brow"><span>Livre depois dos aportes</span><b class="'+(livre>=0?'g':'r')+'">'+brl(livre)+'</b></div></div>';
  if(m===mkey(new Date())&&S.cfg.saldo!==''&&S.cfg.saldo!=null){
    var after=(+S.cfg.saldo)-c.aPagar;
    h+='<div class="card"><h3>Conta corrente</h3>'+
       '<div class="brow"><span>Saldo informado</span><b>'+brl(S.cfg.saldo)+'</b></div>'+
       '<div class="brow"><span>Depois de pagar o que falta</span><b class="'+(after>=0?'g':'r')+'">'+brl(after)+'</b></div></div>';
  }
  return h;
}

function rContas(){
  var m=view.m,c=calc(m),h='';
  h+='<div class="grid"><div class="card"><div class="lbl">Previsto</div><div class="v">'+brl(c.total)+'</div></div>'+
     '<div class="card"><div class="lbl">A pagar</div><div class="v a">'+brl(c.aPagar)+'</div></div></div>';
  h+='<div class="card"><h3>Contas de '+mlabel(m)+'</h3>';
  var list=S.itens.filter(function(i){return ativo(i,m)});
  list.forEach(function(i){
    var tags='<span class="tag">'+(i.tipo==='D'?'Desejo':'Necessidade')+'</span>'+(i.flex?'<span class="tag">flexível</span>':'')+(i.dia?'<span class="tag">dia '+esc(i.dia)+'</span>':'')+(i.qtd!=null&&i.qtd!==''?'<span class="tag">'+i.qtd+' × '+brl(i.unit)+'</span>':'');
    h+='<div class="row"><button class="chk" onclick="tgl(\''+i.id+'\')">'+(isPago(m,i.id)?'✅':'⬜')+'</button>'+
       '<div class="rmain" onclick="editItem(\''+i.id+'\')"><b>'+esc(i.nome)+'</b><small>'+tags+'</small></div>'+
       '<div class="rval" onclick="editItem(\''+i.id+'\')">'+brl(valorIt(i))+'</div></div>';
  });
  if(!list.length)h+='<div class="note">Nenhuma conta ativa neste mês.</div>';
  h+='</div><button class="btn" onclick="editItem(\'\')">➕ Nova conta</button>';
  var out=S.itens.length-list.length;
  if(out>0)h+='<div class="note">'+out+' conta(s) encerrada(s) ou futura(s) não aparecem neste mês.</div>';
  return h;
}
function tgl(id){var m=view.m;if(!S.pagos[m])S.pagos[m]={};S.pagos[m][id]=!S.pagos[m][id];save();render()}

function modal(html){var d=document.getElementById('modal');d.innerHTML='<div class="sheet">'+html+'</div>';d.className='on'}
function closeModal(){var d=document.getElementById('modal');d.className='';d.innerHTML=''}

function editItem(id){
  var i=id?S.itens.filter(function(x){return x.id===id})[0]:{nome:'',valor:'',tipo:'N',dia:'',flex:false,desde:'',ate:''};
  if(!i)return;
  var comb=i.qtd!=null&&i.qtd!=='';
  var h='<h3>'+(id?'Editar conta':'Nova conta')+'</h3>'+
    '<label>Nome</label><input id="f_nome" value="'+esc(i.nome)+'">';
  if(comb){
    h+='<label>Abastecimentos por mês</label><input id="f_qtd" inputmode="decimal" value="'+esc(i.qtd)+'">'+
       '<label>Valor médio por abastecimento (R$)</label><input id="f_unit" inputmode="decimal" value="'+esc(i.unit)+'">';
  }else{
    h+='<label>Valor mensal (R$)</label><input id="f_valor" inputmode="decimal" value="'+esc(i.valor)+'">';
  }
  h+='<label>Tipo</label><select id="f_tipo"><option value="N"'+(i.tipo==='N'?' selected':'')+'>Necessidade</option><option value="D"'+(i.tipo==='D'?' selected':'')+'>Desejo</option></select>'+
     '<label>Dia do vencimento (opcional)</label><input id="f_dia" inputmode="numeric" value="'+esc(i.dia)+'">'+
     '<label>Vale a partir de (opcional)</label><input id="f_desde" type="month" value="'+esc(i.desde)+'">'+
     '<label>Vale até (opcional, ex.: última parcela)</label><input id="f_ate" type="month" value="'+esc(i.ate)+'">'+
     '<label class="chkl" style="margin-top:14px"><input id="f_flex" type="checkbox" '+(i.flex?'checked':'')+'> Gasto flexível (dá para reduzir)</label>'+
     '<button class="btn" onclick="saveItem(\''+(id||'')+'\')">Salvar</button>'+
     (id?'<button class="btn del" onclick="delItem(\''+id+'\')">Excluir conta</button>':'')+
     '<button class="btn sec" onclick="closeModal()">Cancelar</button>';
  modal(h);
}
function saveItem(id){
  var g=function(x){return document.getElementById(x)};
  var nome=g('f_nome').value.trim();
  if(!nome){alert('Informe o nome da conta');return}
  var o={nome:nome,tipo:g('f_tipo').value,dia:g('f_dia').value.trim(),flex:g('f_flex').checked,desde:g('f_desde').value,ate:g('f_ate').value};
  if(g('f_qtd')){o.qtd=num(g('f_qtd').value);o.unit=num(g('f_unit').value);o.valor=o.qtd*o.unit}
  else{o.valor=num(g('f_valor').value)}
  var cur=id?S.itens.filter(function(x){return x.id===id})[0]:null;
  if(cur)Object.assign(cur,o);else S.itens.push(Object.assign({id:uid(),obs:''},o));
  save();closeModal();render();
}
function delItem(id){
  if(!confirm('Excluir esta conta de todos os meses?'))return;
  S.itens=S.itens.filter(function(x){return x.id!==id});
  save();closeModal();render();
}

var TIPOS=[['saida','💸 Saída'],['entrada','💵 Entrada'],['aporte','📈 Aporte'],['resgate','🏧 Resgate']];
var TNOME={saida:'Saída',entrada:'Entrada',aporte:'Aporte',resgate:'Resgate'};
function rLancar(){
  var m=view.m,t=view.tipo,h='<div class="seg">';
  TIPOS.forEach(function(x){h+='<button class="'+(t===x[0]?'on':'')+'" onclick="setTipo(\''+x[0]+'\')">'+x[1]+'</button>'});
  h+='</div><div class="card"><label style="margin-top:0">Valor (R$)</label><input id="l_valor" inputmode="decimal" placeholder="0,00">'+
     '<label>Descrição</label><input id="l_desc" placeholder="'+(t==='aporte'?'Ex.: Tesouro, CDB':'Ex.: farmácia')+'">';
  if(t==='saida')h+='<label>Classificação</label><select id="l_cls"><option value="N">Necessidade</option><option value="D">Desejo</option></select>';
  var hoje=new Date(),def=mkey(hoje)===m?hoje.toISOString().slice(0,10):m+'-01';
  if(mkey(hoje)===m){def=hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0')}
  h+='<label>Data</label><input id="l_data" type="date" value="'+def+'">'+
     '<button class="btn" onclick="addLanc()">Lançar '+TNOME[t].toLowerCase()+'</button>'+
     (t==='aporte'||t==='resgate'?'<div class="note">'+(t==='aporte'?'O aporte soma ao total investido.':'O resgate subtrai do total investido.')+'</div>':'')+'</div>';
  h+='<div class="card"><h3>Lançamentos de '+mlabel(m)+'</h3>';
  var ls=S.lanc.filter(function(l){return String(l.data).slice(0,7)===m}).sort(function(a,b){return a.data<b.data?1:-1});
  ls.forEach(function(l){
    var sign=(l.tipo==='saida'||l.tipo==='aporte')?'−':'+';
    h+='<div class="row"><div class="rmain"><b>'+esc(l.desc||TNOME[l.tipo])+'</b><small>'+TNOME[l.tipo]+(l.tipo==='saida'?' · '+(l.cls==='D'?'desejo':'necessidade'):'')+' · '+esc(String(l.data).split('-').reverse().join('/'))+'</small></div>'+
       '<div class="rval">'+sign+' '+brl(l.valor)+'</div><button class="chk" onclick="delLanc(\''+l.id+'\')">✕</button></div>';
  });
  if(!ls.length)h+='<div class="note">Nada lançado neste mês.</div>';
  return h+'</div>';
}
function setTipo(t){view.tipo=t;render()}
function applyInv(l,sg){
  var v=+l.valor||0;
  if(l.tipo==='aporte')S.cfg.investido=(+S.cfg.investido||0)+sg*v;
  if(l.tipo==='resgate')S.cfg.investido=(+S.cfg.investido||0)-sg*v;
}
function addLanc(){
  var v=num(document.getElementById('l_valor').value);
  if(!(v>0)){alert('Informe um valor maior que zero');return}
  var cl=document.getElementById('l_cls');
  var l={id:uid(),data:document.getElementById('l_data').value||(view.m+'-01'),tipo:view.tipo,cls:cl?cl.value:'N',desc:document.getElementById('l_desc').value.trim(),valor:v};
  S.lanc.push(l);applyInv(l,1);save();render();
}
function delLanc(id){
  var l=S.lanc.filter(function(x){return x.id===id})[0];
  if(!l||!confirm('Excluir este lançamento?'))return;
  applyInv(l,-1);
  S.lanc=S.lanc.filter(function(x){return x.id!==id});
  save();render();
}

function rReserva(){
  var cur=mkey(new Date()),c=calc(cur),cs=calc(cur,true);
  var custo=c.total,meses=+S.cfg.mesesReserva||6,meta=custo*meses,inv=+S.cfg.investido||0;
  var cob=custo?inv/custo:0,falta=Math.max(0,meta-inv),plan=+S.cfg.aportePlan||0;
  var prev=plan>0?Math.ceil(falta/plan):null;
  var w=meta?Math.min(100,inv/meta*100):0;
  var h='<div class="card hero"><div class="lbl">Total investido</div><div class="big g">'+brl(inv)+'</div>'+
        '<div class="sub">Cobre '+cob.toLocaleString('pt-BR',{maximumFractionDigits:1})+' meses do seu custo de vida</div></div>';
  h+='<div class="card"><h3>Reserva de emergência</h3>'+
     '<div class="brow"><span>Custo mensal ('+mlabel(cur)+')</span><b>'+brl(custo)+'</b></div>'+
     '<label style="margin-top:0">Meta em meses de custo</label><select onchange="setCfg(\'mesesReserva\',this.value)">'+
     [3,6,9,12].map(function(n){return '<option value="'+n+'"'+(n===meses?' selected':'')+'>'+n+' meses</option>'}).join('')+'</select>'+
     '<div class="brow" style="margin-top:12px"><span>Meta</span><b>'+brl(meta)+'</b></div>'+
     '<div class="track" style="margin:6px 0 10px"><div class="fill ok" style="width:'+w+'%"></div></div>'+
     '<div class="brow"><span>Falta</span><b class="'+(falta>0?'a':'g')+'">'+brl(falta)+'</b></div>'+
     (prev!==null?'<div class="brow"><span>Previsão com o aporte do plano</span><b>'+(falta===0?'meta atingida':prev+' mês(es) · '+mlabel(addM(cur,prev)))+'</b></div>':'')+
     '<div class="note">Previsão sem rendimento. O custo mensal sobe em janeiro de 2027 para o valor sem o IPVA, e a meta cai junto.</div></div>';
  h+='<div class="card"><h3>Seus números</h3>'+
     '<label style="margin-top:0">Total investido (R$)</label><input inputmode="decimal" value="'+esc(S.cfg.investido)+'" onchange="setCfg(\'investido\',this.value)">'+
     '<label>Aporte mensal planejado (R$)</label><input inputmode="decimal" value="'+esc(S.cfg.aportePlan)+'" onchange="setCfg(\'aportePlan\',this.value)">'+
     '<div class="note">Hoje o plano é R$ 4.000 do extra + R$ 872,04 da diferença do aumento. Sem o extra, a sobra mensal do orçamento cai para '+brl(cs.sobra)+'.</div></div>';
  return h;
}

function rConfig(){
  var c=S.cfg,M=c.meta,cur=mkey(new Date()),cc=calc(cur),cs=calc(cur,true);
  var h='<div class="card"><h3>💼 Renda</h3>'+
    '<label style="margin-top:0">Salário líquido (R$)</label><input inputmode="decimal" value="'+esc(c.salario)+'" onchange="setCfg(\'salario\',this.value)">'+
    '<label>Salário extra (R$)</label><input inputmode="decimal" value="'+esc(c.extra)+'" onchange="setCfg(\'extra\',this.value)">'+
    '<label class="chkl" style="margin-top:14px"><input type="checkbox" '+(c.extraAtivo?'checked':'')+' onchange="setCfg(\'extraAtivo\',this.checked)"> Extra ativo</label>'+
    '<label>Extra vale até (opcional)</label><input type="month" value="'+esc(c.extraAte)+'" onchange="setCfg(\'extraAte\',this.value)">'+
    '<label>Saldo na conta corrente hoje (opcional)</label><input inputmode="decimal" value="'+esc(c.saldo)+'" onchange="setCfg(\'saldo\',this.value)"></div>';
  h+='<div class="card"><h3>🎯 Metas (% da renda do mês)</h3>'+
    '<label style="margin-top:0">Necessidades até</label><input inputmode="numeric" value="'+M.nec+'" onchange="setMeta(\'nec\',this.value)">'+
    '<label>Desejos até</label><input inputmode="numeric" value="'+M.des+'" onchange="setMeta(\'des\',this.value)">'+
    '<label>Poupança no mínimo</label><input inputmode="numeric" value="'+M.poup+'" onchange="setMeta(\'poup\',this.value)">'+
    '<div class="note">As metas usam a renda total do mês (salário + extra). Sem o extra, a mesma conta fica apertada, e o painel mostra isso.</div></div>';
  h+='<div class="card"><h3>✂️ Simulador de corte</h3>'+
    '<div class="note" style="margin-top:0">Gastos flexíveis em '+mlabel(cur)+': <b>'+brl(cc.flex)+'</b> (luz, combustível, mercado, cartão e o que você marcar como flexível).</div>'+
    '<label>Reduzir os flexíveis em: <b id="simp">10</b>%</label><input type="range" min="0" max="30" value="10" oninput="sim(this.value)">'+
    '<div id="simres"></div></div>';
  h+='<div class="card"><h3>💾 Backup</h3>'+
    '<div class="note" style="margin-top:0">Os dados ficam só neste navegador. Faça um backup de vez em quando.</div>'+
    '<button class="btn sec" onclick="backup()">📋 Copiar backup</button>'+
    '<button class="btn sec" onclick="restaurar()">📥 Restaurar backup</button>'+
    '<button class="btn del" onclick="resetar()">♻️ Voltar aos dados iniciais</button></div>';
  setTimeout(function(){sim(10)},0);
  return h;
}
function sim(p){
  var cur=mkey(new Date()),cc=calc(cur),cs=calc(cur,true),eco=cc.flex*(+p)/100;
  var a=document.getElementById('simp'),r=document.getElementById('simres');
  if(!a||!r)return;
  a.textContent=p;
  r.innerHTML='<div class="brow" style="margin-top:12px"><span>Economia por mês</span><b class="g">'+brl(eco)+'</b></div>'+
    '<div class="brow"><span>Economia em 12 meses</span><b class="g">'+brl(eco*12)+'</b></div>'+
    '<div class="brow"><span>Nova sobra (com extra)</span><b>'+brl(cc.sobra+eco)+'</b></div>'+
    '<div class="brow"><span>Nova sobra (sem extra)</span><b class="'+(cs.sobra+eco>=0?'g':'r')+'">'+brl(cs.sobra+eco)+'</b></div>';
}
var NUMK={salario:1,extra:1,investido:1,aportePlan:1,mesesReserva:1};
function setCfg(k,v){
  if(k==='saldo')S.cfg.saldo=String(v).trim()===''?'':num(v);
  else S.cfg[k]=NUMK[k]?num(v):v;
  save();render();
}
function setMeta(k,v){S.cfg.meta[k]=num(v);save();render()}
function backup(){
  var t=JSON.stringify(S);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('Backup copiado. Cole em um lugar seguro (notas, e-mail para você).')},function(){prompt('Copie o backup:',t)})}
  else prompt('Copie o backup:',t);
}
function restaurar(){
  var t=prompt('Cole aqui o backup:');
  if(!t)return;
  try{var o=JSON.parse(t);if(!o.cfg||!o.itens)throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;S=o;save();render();alert('Backup restaurado.')}
  catch(e){alert('Backup inválido.')}
}
function resetar(){if(!confirm('Apagar tudo e voltar aos dados iniciais?'))return;S=seed();save();render()}

function mv(n){view.m=addM(view.m,n);render()}
function go(t){view.tab=t;render(true)}
function render(top){
  var y=window.scrollY;
  document.getElementById('mlabel').textContent=mlabel(view.m);
  var fn={painel:rPainel,contas:rContas,lancar:rLancar,reserva:rReserva,config:rConfig}[view.tab];
  document.getElementById('view').innerHTML=fn();
  var bs=document.querySelectorAll('#nav button');
  for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-t')===view.tab?'on':'';
  window.scrollTo(0,top?0:y);
}
load();
render(true);
</script>
</body>
</html>
